server:
  port: 8081
  read_timeout: 30s
  write_timeout: 120s
  db_path: data/gateway.db
  max_concurrency: 500
  queue_size: 200
  queue_timeout: 10s
  transport:
    max_conns_per_host: 100
    max_idle_conns_per_host: 50
    max_idle_conns: 200

auth:
  # Safe bootstrap default: no reusable gateway key is shipped in the repo.
  enabled: false
  keys: []

providers:
  # The legacy example keeps the current process reproducibly startable, but
  # cannot reach an upstream or authenticate there: .invalid is reserved.
  - name: legacy-invalid-example
    type: openai
    api_key: invalid-example-provider-key
    base_url: https://example.invalid/v1
    models:
      - invalid-example-model

  # Native provider declarations are schema-only in M0. Their credentials are
  # references (environment variable names), never secret values. Enabling one
  # fails validation until its dedicated M3 adapter exists.
  - name: ark-bootstrap
    kind: ark
    enabled: false
    credential:
      env: ARK_API_KEY
    evidence:
      status: unverified
    ark:
      base_url: https://ark.cn-beijing.volces.com/api/v3
      region: cn-beijing
      protocol_version: responses-v1
      endpoint_id: invalid-example-ark-endpoint-id
    models:
      - invalid-example-ark-model

  - name: deepseek-bootstrap
    kind: deepseek
    enabled: false
    credential:
      env: DEEPSEEK_API_KEY
    evidence:
      status: unverified
    deepseek:
      base_url: https://api.deepseek.com
      region: global
      protocol_version: chat-completions-v1
      endpoint: stable
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro

  - name: qwen-bootstrap
    kind: qwen
    enabled: false
    credential:
      env: DASHSCOPE_API_KEY
    evidence:
      status: unverified
    qwen:
      base_url: https://invalid-example-workspace-id.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      region: cn-beijing
      protocol_version: chat-completions-v1
      workspace_id: invalid-example-workspace-id
    models:
      - qwen3.7-flash

routes:
  - name: invalid-bootstrap-route
    match:
      model: invalid-example-model
    strategy: round_robin
    targets:
      - provider: legacy-invalid-example
        model: invalid-example-model

rate_limit:
  enabled: false
  per_key: 60
  per_model: 100

quota:
  enabled: false
  reset_hour_utc: 0

cache:
  enabled: true
  backend: memory          # memory | redis
  ttl: 1h
  strategy: exact          # exact | semantic
  max_size: 1000
  threshold: 0.85          # similarity threshold for semantic cache
  redis_addr: localhost:6379
  redis_pass: ""
  redis_db: 0

filter:
  enabled: true
  mode: mask               # mask | block
  rules:
    - phone_cn
    - id_card_cn
    - email
    - credit_card
    - api_key
