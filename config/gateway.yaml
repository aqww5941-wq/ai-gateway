server:
  port: 8080
  read_timeout: 30s
  write_timeout: 120s

auth:
  enabled: false
  keys: []

providers:
  - name: deepseek
    type: openai
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com/v1
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro
  - name: siliconflow
    type: openai
    api_key: ${SILICONFLOW_API_KEY}
    base_url: https://api.siliconflow.cn/v1
    models:
      - Pro/moonshotai/Kimi-K2.6
      - MiniMaxAI/MiniMax-M2.5
    timeout: 60s

  - name: doubao
    type: openai
    api_key: ${DOUBAO_API_KEY}
    base_url: https://ark.cn-beijing.volces.com/api/v3
    models:
      - doubao-seed-2-0-pro-260215
      - doubao-seed-2-0-mini-260428
    timeout: 60s

routes:
  - name: cheap-first
    match:
      model: deepseek-v4-flash
    strategy: round_robin
    targets:
      - provider: deepseek
        model: deepseek-v4-flash

  - name: smart-route
    match:
      model: auto
    strategy: semantic
    targets: []
    semantic_rules:
      - complexity: simple
        target:
          provider: doubao
          model: doubao-seed-2-0-mini-260428
      - complexity: complex
        target:
          provider: doubao
          model: doubao-seed-2-0-pro-260215
  
  - name: siliconflow-kimi
    match:
      model: kimi
    strategy: round_robin
    targets:
      - provider: siliconflow
        model: Pro/moonshotai/Kimi-K2.6

  - name: siliconflow-minimax
    match:
      model: minimax
    strategy: round_robin
    targets:
      - provider: siliconflow
        model: MiniMaxAI/MiniMax-M2.5

  - name: doubao-seed
    match:
      model: doubao
    strategy: semantic
    targets: []
    semantic_rules:
      - complexity: simple
        target:
          provider: doubao
          model: doubao-seed-2-0-mini-260428
      - complexity: complex
        target:
          provider: doubao
          model: doubao-seed-2-0-pro-260215

  - name: siliconflow-auto
    match:
      model: siliconflow
    strategy: semantic
    targets: []
    semantic_rules:
      - complexity: simple
        target:
          provider: siliconflow
          model: MiniMaxAI/MiniMax-M2.5
      - complexity: complex
        target:
          provider: siliconflow
          model: Pro/moonshotai/Kimi-K2.6

rate_limit:
  enabled: false
  per_key: 60
  per_model: 100

cache:
  enabled: true
  backend: memory          # memory | redis
  ttl: 1h
  strategy: exact          # exact | semantic
  max_size: 1000
  threshold: 0.85          # similarity threshold for semantic cache
  redis_addr: localhost:6379
  redis_pass: ""
  redis_db: 0
